name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # macOS is expensive on a private repo (10x minute multiplier) and slow to
    # schedule, so it is checked weekly rather than on every push.
    - cron: '0 6 * * 1'

# A new push supersedes the previous run on the same ref. Without this, ten
# pushes leave ten runs queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The pinned RGBDS tarball never changes unless tools/rgbds.py does.
      - name: Cache the RGBDS toolchain
        uses: actions/cache@v4
        with:
          path: build/toolchain
          key: rgbds-${{ runner.os }}-${{ hashFiles('tools/rgbds.py') }}

      # The ground truth: the stock ROM must still rebuild byte for byte.
      # If this fails the change is wrong. See CLAUDE.md principle 4.
      - name: Rebuild the original ROM
        run: python3 build.py --original --freespace

      # --patch also emits the BPS a release ships, and verifies that applying
      # it to the stock ROM reproduces this build.
      - name: Build the Lab ROM and the release patch
        run: python3 build.py --patch

      - name: Byte-level tests
        run: |
          python3 tests/test_original.py
          python3 tests/test_expansion.py

      - name: Install the test-only emulator dependency
        run: python3 -m pip install -r requirements-dev.txt

      - name: Behavioural tests
        run: |
          python3 tests/test_behaviour.py
          python3 tests/test_menu.py
          python3 tests/test_restart.py
          python3 tests/test_sps.py
          python3 tests/test_labmenu.py
          python3 tests/test_link.py
          python3 tests/test_hiscore.py
          python3 tests/test_pieces.py
          python3 tests/test_lfsr_vectors.py
          python3 tests/test_trep.py
          python3 tests/test_crunch.py
          python3 tests/test_qtap.py
          python3 tests/test_quit.py

      # Patches only, never ROM data. See docs/research.md section 7.
      - name: Assert no ROM data is tracked
        run: |
          if git ls-files | grep -iE '\.(gb|gbc|nes|bps|ips)$'; then
            echo "::error::ROM or patch data is tracked in git"
            exit 1
          fi
          echo "ok: no ROM data tracked"

  # Two patch channels, each a pre-release with a fixed download URL:
  #
  #   nightly   every push to main
  #   preview   every pull request, so a build can be tried before it is merged
  #
  # Both gated on `needs: test`. A build that fails its own suite must not
  # become the thing a phone picks up.
  #
  # preview publishes from pull_request runs, which for a same-repo branch have
  # a writable token. Fork pull requests do not, and are skipped rather than
  # failing - a fork must not be able to publish to this repo's releases anyway.
  publish:
    name: publish patch
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache the RGBDS toolchain
        uses: actions/cache@v4
        with:
          path: build/toolchain
          key: rgbds-${{ runner.os }}-${{ hashFiles('tools/rgbds.py') }}

      - name: Publish the patch
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_LABEL: >-
            ${{ github.event_name == 'pull_request'
                && format('#{0} {1}', github.event.pull_request.number, github.event.pull_request.title)
                || github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tools/nightly.sh nightly
          else
            tools/nightly.sh preview
          fi

  macos:
    name: macOS build (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild the original ROM
        run: python3 build.py --original
